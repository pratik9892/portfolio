services:
  # Phase 1: static site served by nginx (ADR-0004)
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_SOURCE: static
      secrets:
        - github_token
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Public tunnel to `web`. Needs NGROK_AUTHTOKEN in .env.
  # The public URL is shown at http://localhost:4040 and in `docker compose logs ngrok`.
  ngrok:
    image: ngrok/ngrok:3-alpine
    command: ["http", "web:80", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Phase 2 (ADR-0005): start with `docker compose --profile backend up`.
  api:
    profiles: [backend]
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-portfolio}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    profiles: [backend]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  pgdata:
